<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=hub1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%232563EB%22/></svg>">
<script>
/* Theme before first paint, so dark mode never flashes white. */
try {
  var t = localStorage.getItem("js-theme");
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
} catch (_) { /* private window */ }
</script>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="head-top">
      <div class="title">
        <span class="hero-dot"></span>
        <h1>Job Search</h1>
        <span class="for" id="for-name"></span>
      </div>
      <div class="actions">
        <button class="btn outlined" id="btn-scan" title="Look for new jobs right now, instead of waiting for the next scheduled search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search now</span>
        </button>
        <button class="btn contained" id="btn-apply" title="Send the applications on your apply queue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          <span>Run apply queue</span>
        </button>
        <button class="btn outlined" id="btn-refresh" title="Read everything again">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Refresh</span>
        </button>
        <button class="btn icon" id="btn-theme" title="Switch between light and dark" aria-label="Switch between light and dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div class="strip" id="strip"><span class="strip-item"><span class="dot"></span><span class="strip-label">Reading the board</span></span></div>
  </header>

  <main class="body">
    <div id="alerts"></div>
    <section class="card" id="room">
      <nav class="tabs" id="tabs"></nav>
      <div class="card-body" id="content"></div>
    </section>
    <div class="source-line" id="source-line">source: this computer, dashboard/data/positions.json</div>
  </main>
</div>

<div id="dialogs"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js?v=hub1"></script>
</body>
</html>
