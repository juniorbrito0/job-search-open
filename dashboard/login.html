<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Job Search</title>
<link rel="stylesheet" href="/styles.css?v=hub1">
<link rel="stylesheet" href="/web.css?v=w1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%232563EB%22/></svg>">
<script>
try {
  var t = localStorage.getItem("js-theme");
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  var l = localStorage.getItem("js-lang") || (/^pt/i.test(navigator.language || "") ? "pt" : "en");
  document.documentElement.dataset.lang = l;
  document.documentElement.lang = l === "pt" ? "pt-BR" : "en";
} catch (_) { document.documentElement.dataset.lang = "en"; }
</script>
<script src="/i18n.js?v=w1"></script>
</head>
<body>
<div class="solo">
  <form class="solo-card" id="f">
    <div class="lang-row">
      <button type="button" class="btn small" data-lang="pt">Português</button>
      <button type="button" class="btn small" data-lang="en">English</button>
    </div>
    <h1><span class="hero-dot"></span><span data-t="Job Search"></span></h1>
    <p data-t="Your private job search page."></p>
    <label class="lbl" for="pw" data-t="Password"></label>
    <input class="field" id="pw" type="password" autocomplete="current-password" autofocus required>
    <div class="err" id="err" role="alert"></div>
    <button class="btn contained" id="go" type="submit" data-t="Sign in"></button>
  </form>
</div>
<script>
"use strict";
const T = (s) => window.I18N.t(s);
function paint() {
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
  document.title = T("Job Search");
}
paint();
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
  document.documentElement.dataset.lang = b.dataset.lang;
  try { localStorage.setItem("js-lang", b.dataset.lang); } catch (_) { /* private window */ }
  paint();
}));
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go");
  const err = document.getElementById("err");
  go.disabled = true;
  go.textContent = T("Signing in");
  err.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("pw").value }),
    });
    if (res.ok) { location.href = "/"; return; }
    err.textContent = res.status === 429 ? T("Too many tries. Wait a moment and try again.") : T("Wrong password. Try again.");
  } catch (_) {
    err.textContent = T("The page is not answering. Check that you are on the home Wi-Fi.");
  }
  go.disabled = false;
  go.textContent = T("Sign in");
});
</script>
</body>
</html>
