<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Job Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=hub1">
<link rel="stylesheet" href="/web.css?v=w1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%232563EB%22/></svg>">
<script>
try {
  var t = localStorage.getItem("js-theme");
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  document.documentElement.dataset.lang = localStorage.getItem("js-lang") || "en";
} catch (_) { document.documentElement.dataset.lang = "en"; }
</script>
<script src="/i18n.js?v=w1"></script>
<script src="/chat.js?v=w1"></script>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const T = (s) => window.I18N.t(s);
const app = document.getElementById("app");

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 7000);
}

function setLang(lang) {
  document.documentElement.dataset.lang = lang;
  document.documentElement.lang = lang === "pt" ? "pt-BR" : "en";
  try { localStorage.setItem("js-lang", lang); } catch (_) { /* private window */ }
}

function pickLanguage() {
  app.innerHTML = `<div class="solo"><div class="solo-card">
    <h1><span class="hero-dot"></span>Português ou English?</h1>
    <p>Qual idioma você prefere? · Which language do you prefer?</p>
    <div class="lang-pick">
      <button data-lang="pt"><span class="flag">🇧🇷</span><b>Português</b></button>
      <button data-lang="en"><span class="flag">🇨🇦</span><b>English</b></button>
    </div>
    <p class="cap">Dá para mudar depois · You can change this later</p>
  </div></div>`;
  app.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", async () => {
    const lang = b.dataset.lang;
    setLang(lang);
    await fetch("/api/language", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ language: lang }) });
    startChat(lang);
  }));
}

function startChat(lang) {
  app.innerHTML = `<div class="chat-page">
    <div class="chat-head">
      <h1><span class="hero-dot"></span>${T("Your job search assistant")}</h1>
      <div class="actions">
        <button class="btn small" id="restart">${T("Start over")}</button>
        <button class="btn small" id="logout">${T("Sign out")}</button>
      </div>
    </div>
    <div id="chat" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  </div>`;
  const chat = window.JSChat.mount(document.getElementById("chat"), {
    mode: "onboarding",
    autoStart: () => `[Page note, not typed by the candidate] The candidate just opened the page for the first time and chose ${lang === "pt" ? "Brazilian Portuguese" : "English"}. Start the onboarding interview now (docs/WEB-ONBOARDING.md, step 1).`,
    onState: async (state) => {
      // When the interview is finished the server flips onboarded; the panel takes over.
      if (!state.busy && state.messages.length) {
        const res = await fetch("/api/web", { cache: "no-store" });
        const web = await res.json();
        if (web.onboarded && !document.getElementById("to-panel")) {
          const bar = document.createElement("div");
          bar.className = "msg-actions";
          bar.innerHTML = `<button class="btn contained" id="to-panel">${T("Open my job search panel")}</button>`;
          document.querySelector(".chat-log").appendChild(bar);
          document.getElementById("to-panel").addEventListener("click", () => { location.href = "/"; });
        }
      }
    },
  });
  document.getElementById("logout").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    location.href = "/login";
  });
  document.getElementById("restart").addEventListener("click", async () => {
    if (!confirm(T("Start this conversation over? What you already saved stays saved."))) return;
    await fetch("/api/chat/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "onboarding" }) });
    location.reload();
  });
  chat.focus();
}

(async function start() {
  const q = new URLSearchParams(location.search);
  let web = {};
  try {
    const res = await fetch("/api/web", { cache: "no-store" });
    if (res.status === 401) { location.href = "/login"; return; }
    web = await res.json();
  } catch (_) { /* shown by the chat itself */ }
  if (web.onboarded && !q.get("gmail")) { location.href = "/"; return; }
  if (web.language) setLang(web.language);
  if (q.get("gmail") === "connected") toast(T("Gmail is connected."));
  if (q.get("gmail") === "error") toast(`${T("Gmail was not connected:")} ${q.get("why") || ""}`);
  if (q.get("gmail")) history.replaceState(null, "", location.pathname);
  if (web.onboarded) { location.href = "/"; return; }
  if (!web.language) pickLanguage();
  else startChat(web.language);
})();
</script>
</body>
</html>
