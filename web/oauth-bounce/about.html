<title>Job Search</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5fa; --card: #fff; --ink: #2f2b3d; --muted: rgba(47,43,61,.75); }
  @media (prefers-color-scheme: dark) { :root { --bg: #28243d; --card: #312d4b; --ink: #e7e3fc; --muted: rgba(231,227,252,.75); } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { background: var(--card); border-radius: 10px; padding: 24px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-top: 0; } h2 { font-size: 1.05rem; margin-bottom: 4px; } p, li { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1>Job Search</h1>
<p>A private, self-hosted job-search assistant that one household runs on its own computer for a family member. It finds and scores job postings and keeps them on a private page on the home network. It is not offered to the public.</p>
<p><a href="privacy">Privacy notice</a> · Contact: junior@brito.ai</p>
</main>
